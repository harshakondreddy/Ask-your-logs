apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask-your-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ask-your-logs
  template:
    metadata:
      labels:
        app: ask-your-logs
    spec:
      containers:
        - name: ask-your-logs
          image: "{{ IMAGE_REGISTRY }}/ask-your-logs:{{ IMAGE_TAG }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: ask-your-logs-config
            - secretRef:
                name: ask-your-logs-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
