apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-log-router-config
data:
  # Override values per environment without changing deployment YAML.
  ELASTICSEARCH_URL: http://elasticsearch.logging.svc.cluster.local:9200
  ELASTICSEARCH_INDEX: logs-*
  ELASTICSEARCH_TIMESTAMP_FIELD: "@timestamp"
  ELASTICSEARCH_VERIFY_CERTS: "false"
  # Optional. Set when using custom CA trust.
  # Example: /etc/ssl/certs/ca.crt
  ELASTICSEARCH_CA_CERT_PATH: ""
  # Optional Elasticsearch auth. Keep empty when auth is disabled.
  ELASTICSEARCH_USERNAME: ""
  ELASTICSEARCH_PASSWORD: ""

  # LLM provider: gemini | openai | azure_openai | ollama
  LLM_PROVIDER: gemini
  # Set only the key needed by selected LLM_PROVIDER.
  GEMINI_API_KEY: "replace-with-gemini-key"
  OPENAI_API_KEY: ""
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_DEPLOYMENT: ""
  GEMINI_MODEL: gemini-flash-latest
  OPENAI_MODEL: gpt-4o-mini
  AZURE_OPENAI_API_VERSION: "2024-02-01"
  OLLAMA_BASE_URL: http://ollama-gemma3-4b.essential.svc.cluster.local:18080
  OLLAMA_MODEL: gemma3:4b
  OLLAMA_TIMEOUT_SECONDS: "600"

  MAX_LOGS_LIMIT: "330"
  REQUEST_TIMEOUT_SECONDS: "30"
