apiVersion: v1
kind: Secret
metadata:
  name: ai-log-router-secret
type: Opaque
stringData:
  # Optional template for future hardening.
  # Current manifests can run using configmap values only.
  # Use this file later when you want to move sensitive values out of ConfigMap.

  # Provide only keys needed by the selected LLM provider.

  # Google Gemini (LLM_PROVIDER=gemini)
  GEMINI_API_KEY: replace-with-google-ai-studio-key

  # OpenAI (LLM_PROVIDER=openai)
  OPENAI_API_KEY: replace-with-openai-key

  # Azure OpenAI (LLM_PROVIDER=azure_openai)
  AZURE_OPENAI_API_KEY: replace-with-azure-openai-key
  AZURE_OPENAI_ENDPOINT: https://your-resource.openai.azure.com/
  AZURE_OPENAI_DEPLOYMENT: replace-with-deployment-name

  # Ollama (LLM_PROVIDER=ollama)
  # No API key is required for default local/in-cluster Ollama usage.
  # Set OLLAMA_BASE_URL and OLLAMA_MODEL in ConfigMap or env override.

  # Optional: Elasticsearch read-only credentials.
  # Leave these keys out if the cluster does not require auth.
  ELASTICSEARCH_USERNAME: replace-with-read-only-username
  ELASTICSEARCH_PASSWORD: replace-with-read-only-password
