# Template only. Never commit a filled-in copy (k8s/secret.yaml is git-ignored).
#   cp k8s/secret.example.yaml k8s/secret.yaml   # fill in values, or render with scripts/render-manifest.sh
#   kubectl -n <namespace> apply -f k8s/secret.yaml
# Keys not needed by the selected LLM provider can be deleted.
apiVersion: v1
kind: Secret
metadata:
  name: ai-log-router-secret
type: Opaque
stringData:
  # Elasticsearch: use a dedicated user with read-only access to the log indices only.
  # Delete both keys if the cluster has auth disabled.
  ELASTICSEARCH_USERNAME: "{{ ELASTICSEARCH_USERNAME }}"
  ELASTICSEARCH_PASSWORD: "{{ ELASTICSEARCH_PASSWORD }}"

  # Google Gemini (LLM_PROVIDER=gemini)
  GEMINI_API_KEY: "{{ GEMINI_API_KEY }}"

  # OpenAI (LLM_PROVIDER=openai)
  OPENAI_API_KEY: "{{ OPENAI_API_KEY }}"

  # Azure OpenAI (LLM_PROVIDER=azure_openai)
  AZURE_OPENAI_API_KEY: "{{ AZURE_OPENAI_API_KEY }}"

  # Ollama (LLM_PROVIDER=ollama) needs no key.
