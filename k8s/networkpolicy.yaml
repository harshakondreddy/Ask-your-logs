# Example policy. Adjust selectors, DNS rules, and egress destinations for your CNI and cluster topology.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-log-router
  namespace: ai-log-router
spec:
  podSelector:
    matchLabels:
      app: ai-log-router
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-log-router
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 9201
