# Example policy. Apply into the same namespace as the workload:
#   kubectl -n <namespace> apply -f k8s/networkpolicy.yaml
# Adjust DNS selectors, egress CIDRs, and ports for your CNI and cluster topology.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ask-your-logs
spec:
  podSelector:
    matchLabels:
      app: ask-your-logs
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only pods in the same namespace (and kubectl port-forward via the kubelet).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Narrow 0.0.0.0/0 to your Elasticsearch / LLM endpoints where possible.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 9201
        - protocol: TCP
          port: 11434
